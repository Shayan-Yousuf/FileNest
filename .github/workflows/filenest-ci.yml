name: FileNest Java CI

on:
  push:
    paths:
      - "FileNest/**"
      - ".github/workflows/filenest-ci.yml"
  pull_request:
    paths:
      - "FileNest/**"
      - ".github/workflows/filenest-ci.yml"
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile source for Java 17
        working-directory: FileNest
        run: |
          rm -rf out
          mkdir -p out
          javac --release 17 -Xlint:all -d out src/filenest/FileNestApp.java

      - name: Build executable JAR
        working-directory: FileNest
        run: |
          jar --create --file FileNest.jar --main-class filenest.FileNestApp -C out .

      - name: Verify executable JAR and Java 17 bytecode
        working-directory: FileNest
        run: |
          jar --list --file FileNest.jar | grep -qx 'filenest/FileNestApp.class'
          unzip -p FileNest.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: filenest.FileNestApp$'
          javap -verbose -classpath FileNest.jar filenest.FileNestApp | grep -q 'major version: 61'

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: FileNest-Java17
          path: FileNest/FileNest.jar
          if-no-files-found: error
          retention-days: 14
