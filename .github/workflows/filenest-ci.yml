name: FileNest Java CI

on:
  push:
    paths:
      - "FileNest/**"
      - ".github/workflows/filenest-ci.yml"
  pull_request:
    paths:
      - "FileNest/**"
      - ".github/workflows/filenest-ci.yml"
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile source for Java 17
        working-directory: FileNest
        run: |
          rm -rf out
          mkdir -p out
          javac --release 17 -Xlint:all -d out src/filenest/FileNestApp.java

      - name: Build executable JAR
        working-directory: FileNest
        run: |
          jar --create --file FileNest.jar --main-class filenest.FileNestApp -C out .

      - name: Verify executable JAR and Java 17 bytecode
        working-directory: FileNest
        run: |
          set -euo pipefail
          jar --list --file FileNest.jar | grep -Fq 'filenest/FileNestApp.class'
          manifest_main=$(unzip -p FileNest.jar META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Main-Class: //p')
          test "$manifest_main" = "filenest.FileNestApp"
          class_major=$(unzip -p FileNest.jar filenest/FileNestApp.class | od -An -t x1 -j 6 -N 2 | tr -d ' \n')
          echo "JAR main class: $manifest_main"
          echo "Class major-version bytes: $class_major (003d means Java 17)"
          test "$class_major" = "003d"

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: FileNest-Java17
          path: FileNest/FileNest.jar
          if-no-files-found: error
          retention-days: 14
